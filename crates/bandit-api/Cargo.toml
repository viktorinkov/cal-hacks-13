[package]
name = "bandit-api"
version = "0.1.0"
edition = "2024"

[dependencies]
bandit-bindings = { path = "../bandit-bindings" }
bandit-common = { path = "../bandit-common" }
anyhow = "1"
axum = "0.8"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spacetimedb-sdk = "2.13"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
