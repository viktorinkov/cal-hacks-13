description = "Shared service plumbing for BandIt: config, blob and token stores, logging"
publish = false

[dependencies]
anyhow = "1"
dotenvy = "0.15"
sha2 = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
