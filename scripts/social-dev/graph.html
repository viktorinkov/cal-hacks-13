<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BandIt people graph</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root { --bg: #0f1117; --panel: #181b24; --text: #e8eaf0; --muted: #8b90a0;
          --met: #ff5c8a; --visited: #4c8dff; --works: #3ecf8e; --exhibits: #f5a623; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; gap: 24px;
           align-items: center; padding: 14px 20px; background: linear-gradient(var(--bg), transparent); }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .legend i { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
  .stats { margin-left: auto; display: flex; gap: 18px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat { color: var(--muted); font-size: 12px; text-align: right; }
  #graph { position: absolute; inset: 0; }
  .pulse { animation: pulse 0.8s ease-out; }
  @keyframes pulse { from { color: var(--met); } to { color: var(--text); } }
</style>
</head>
<body>
<header>
  <div>
    <h1>BandIt people graph</h1>
    <div class="sub">The crowd · live from SpacetimeDB · refreshed every 2 s</div>
  </div>
  <div class="legend">
    <span><i style="background:var(--met)"></i>met (minutes together)</span>
    <span><i style="background:var(--visited)"></i>visited booth</span>
    <span><i style="background:var(--works)"></i>works at</span>
    <span><i style="background:var(--exhibits)"></i>exhibits</span>
  </div>
  <div class="stats">
    <div class="stat"><b id="people">0</b>people</div>
    <div class="stat"><b id="met">0</b>met links</div>
    <div class="stat"><b id="visited">0</b>booth visits</div>
    <div class="stat"><b id="booths">0</b>booths</div>
  </div>
</header>
<div id="graph"></div>
<script>
const COLORS = { met: "#ff5c8a", visited: "#4c8dff", works_at: "#3ecf8e", exhibits: "#f5a623" };
const nodes = new vis.DataSet();
const edges = new vis.DataSet();
const network = new vis.Network(document.getElementById("graph"), { nodes, edges }, {
  physics: { solver: "forceAtlas2Based", forceAtlas2Based: { gravitationalConstant: -60, springLength: 90 },
             stabilization: { iterations: 150 } },
  interaction: { hover: true, tooltipDelay: 120 },
  nodes: { font: { color: "#e8eaf0", size: 13, strokeWidth: 3, strokeColor: "#0f1117" } },
  edges: { smooth: false },
});

function nodeStyle(n) {
  if (n.kind === "person") {
    return { id: n.id, label: n.label, shape: n.image ? "circularImage" : "dot", image: n.image || undefined,
             size: 18, borderWidth: 2, color: { border: "#ff5c8a", background: "#2a2e3b" } };
  }
  if (n.kind === "booth") {
    return { id: n.id, label: n.label, shape: "box", margin: 8,
             color: { background: "#1d3a6e", border: "#4c8dff" }, font: { color: "#e8eaf0" } };
  }
  return { id: n.id, label: n.label, shape: "diamond", size: 22, color: { background: "#f5a623", border: "#f5a623" } };
}

function edgeStyle(e) {
  const width = e.kind === "met" ? Math.min(1 + e.weight / 4, 10) : e.kind === "visited" ? 1 + Math.min(e.weight / 20, 3) : 1.5;
  return { id: e.id, from: e.from, to: e.to, width, color: { color: COLORS[e.kind], opacity: e.kind === "met" ? 0.9 : 0.45 },
           title: `${e.kind} · ${e.kind === "met" || e.kind === "visited" ? e.weight + " min" : ""}`, dashes: false };
}

function sync(set, items) {
  const ids = new Set(items.map(i => i.id));
  set.remove(set.getIds().filter(id => !ids.has(id)));
  set.update(items);
}

function setStat(id, value) {
  const el = document.getElementById(id);
  if (el.textContent !== String(value)) { el.textContent = value; el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); }
}

async function refresh() {
  try {
    const g = await (await fetch("/graph.json")).json();
    sync(nodes, g.nodes.map(nodeStyle));
    sync(edges, g.edges.map(edgeStyle));
    setStat("people", g.nodes.filter(n => n.kind === "person").length);
    setStat("booths", g.nodes.filter(n => n.kind === "booth").length);
    setStat("met", g.edges.filter(e => e.kind === "met").length);
    setStat("visited", g.edges.filter(e => e.kind === "visited").length);
  } catch (err) {
    console.error(err);
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
