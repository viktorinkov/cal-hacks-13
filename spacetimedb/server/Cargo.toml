[package]
name = "band1t"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = "2.13"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hyphenate-core = { path = "../../crates/hyphenate-core" }

[dev-dependencies]
spacetimedb = { version = "2.13", features = ["test-utils"] }
